name: AbuseIPDB
slug: abuseipdb
category: agent
description: "IP address reputation and abuse reports from AbuseIPDB"
icon: shield
author: nano
version: 1
requires_credential: required
credential_fields:
  - name: API_KEY
    label: API Key
    field_type: secret
    required: true
    help: "Get your key at https://www.abuseipdb.com/account/api"
allowed_domains:
  - api.abuseipdb.com
config:
  color: red
  artifact_types: [ip]
  trigger: always
  rate_limit_per_min: 60
  rate_limit_per_day: 1000
tags:
  - threat-intel
  - ip-reputation

# NAN-3490: connector.yaml is the declarative nano-connector spec that
# replaces code.ts. `runtime` picks which one nano runs; it stays `deno` until
# cutover, and the shadow-run harness keeps the two event-for-event identical.
runtime: deno
connector_spec: connector.yaml
