name: URLhaus
slug: urlhaus
category: agent
description: "Malicious URL and domain lookup from abuse.ch URLhaus"
icon: shield
author: nano
version: 1
requires_credential: none
credential_fields: []
allowed_domains:
  - urlhaus-api.abuse.ch
config:
  color: orange
  artifact_types: [url, domain]
  trigger: always
  rate_limit_per_min: 60
  rate_limit_per_day: 10000
tags:
  - threat-intel
  - malicious-url

# NAN-3490: connector.yaml is the declarative nano-connector spec that
# replaces code.ts. `runtime` picks which one nano runs; it stays `deno` until
# cutover, and the shadow-run harness keeps the two event-for-event identical.
runtime: deno
connector_spec: connector.yaml
