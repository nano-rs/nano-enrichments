name: Shodan
slug: shodan
category: agent
description: "IP and host reconnaissance — ports, vulnerabilities, services"
icon: search
author: nano
version: 2
requires_credential: required
credential_fields:
  - name: API_KEY
    label: API Key
    field_type: secret
    required: true
    help: "Get your key at https://account.shodan.io"
allowed_domains:
  - api.shodan.io
config:
  color: red
  artifact_types: [ip, domain]
  trigger: always
  rate_limit_per_min: 1
  rate_limit_per_day: 100
tags:
  - recon
  - infrastructure

# NAN-3490: connector.yaml is the declarative nano-connector spec that
# replaces code.ts. `runtime` picks which one nano runs.
# NAN-5284: Shodan runs on its connector. It sends the API key as `?key=`,
# which the wasm sandbox (headers-only credentials) refuses, so nano installs
# this entry as its built-in Shodan threat-intel provider. nano releases that
# do not read `runtime` still install code.ts on Deno.
runtime: connector
connector_spec: connector.yaml
