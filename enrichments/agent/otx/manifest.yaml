name: OTX AlienVault
slug: otx
category: agent
description: "Threat intelligence IOC correlation via OTX AlienVault pulses"
icon: zap
author: nano
version: 1
requires_credential: required
credential_fields:
  - name: API_KEY
    label: OTX API Key
    field_type: secret
    required: true
    help: "Get your key at https://otx.alienvault.com/api"
allowed_domains:
  - otx.alienvault.com
config:
  color: purple
  artifact_types: [ip, domain, hash, url]
  trigger: always
  rate_limit_per_min: 60
  rate_limit_per_day: 10000
tags:
  - threat-intel
  - ioc

# NAN-3490: connector.yaml is the declarative nano-connector spec that
# replaces code.ts. `runtime` picks which one nano runs; it stays `deno` until
# cutover, and the shadow-run harness keeps the two event-for-event identical.
runtime: deno
connector_spec: connector.yaml
