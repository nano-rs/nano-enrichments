name: VirusTotal
slug: virustotal
category: agent
description: "Multi-engine malware scanning and threat intelligence for IPs, domains, hashes, and URLs"
icon: shield
author: nano
version: 1
requires_credential: required
credential_fields:
  - name: API_KEY
    label: API Key
    field_type: secret
    required: true
    help: "Get your key at https://www.virustotal.com/gui/my-apikey"
allowed_domains:
  - www.virustotal.com
config:
  color: blue
  artifact_types: [ip, domain, hash, url]
  trigger: always
  rate_limit_per_min: 4
  rate_limit_per_day: 500
tags:
  - threat-intel
  - malware
  - multi-engine

# NAN-3490: connector.yaml is the declarative nano-connector spec that
# replaces code.ts. `runtime` picks which one nano runs; it stays `deno` until
# cutover, and the shadow-run harness keeps the two event-for-event identical.
runtime: deno
connector_spec: connector.yaml
