name: ThreatFox IOC Feed
slug: threatfox
category: data
description: "Threat intelligence IOC feed from abuse.ch ThreatFox — IPs, domains, URLs, and hashes"
icon: shield
author: nano
version: 3
requires_credential: required
credential_fields:
  - name: API_KEY
    label: Auth Key
    field_type: secret
    required: true
    help: "Required — abuse.ch moved the ThreatFox API behind mandatory auth. Register for a free Auth Key at https://auth.abuse.ch"
allowed_domains:
  - threatfox-api.abuse.ch
config:
  color: orange
  key_field: ioc
  key_type: ip
  is_ioc: true
  refresh_schedule: "0 */6 * * *"
changelog: "Emit IOC value at top-level `key` (abuse.ch field is `ioc`, not `ioc_value`); hoist threat_type/malware/confidence to top level so dedicated ClickHouse columns populate (NAN-1105). Without this every record landed with key_value=\"\" and ReplacingMergeTree collapsed thousands of IOCs into one row."
tags:
  - threat-intel
  - ioc
  - abuse.ch
